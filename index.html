<!doctype html><html lang="fr"><meta name="ms-sp-authoring-source" content="agent"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur SVBT - Formation</title><style>body{font-family:Arial,sans-serif;background:#f7f3ea;color:#151210;margin:0;padding:18px}.app{max-width:850px;margin:auto}.card,.metric{background:#fff;border:1px solid #d6b160;border-radius:14px;padding:16px}.grid,.result{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-weight:700;font-size:13px}select,input,button{width:100%;padding:10px;margin-top:5px;border-radius:8px;border:1px solid #c8b998;box-sizing:border-box}button{background:#720a21;color:white;font-weight:700;border:0;margin-top:15px}.result{grid-template-columns:repeat(3,1fr);margin-top:14px}.metric{text-align:center}.metric b{display:block;color:#720a21;font-size:22px}.note{margin-top:14px;border-left:5px solid #d6b160;background:white;padding:14px}.warn{background:#f5e6e6;border:1px solid #d3aaaa;padding:12px;border-radius:9px;margin-top:12px}h1{color:#720a21}@media(max-width:600px){.grid,.result{grid-template-columns:1fr}}</style><div class="app"><h1>Calculateur pédagogique SVBT</h1><p>Estimation du temps de montée à cœur selon le produit et l’épaisseur. À confirmer avec un sac témoin sondé.</p><div class="card"><div class="grid"><div><label>Produit<select id="p"></select></label></div><div><label>Texture<select id="t"></select></label></div><div><label>Épaisseur maximale (mm)<input id="e" type="number" min="5" max="120" value="30"></label></div><div><label>État initial<select id="s"><option value="1">Réfrigéré 3–5 °C</option><option value=".78">Tempéré 15–20 °C</option><option value="1.4">Surgelé</option></select></label></div></div><button id="go">Calculer</button><div id="o"></div></div></div><script>const D={boeuf:{n:'Bœuf tendre',x:[['Saignant homogène',54],['Rosé',56],['À point',60]],f:'Séchage + reverse sear.'},veau:{n:'Veau (noix, quasi)',x:[['Rosé',56],['À point',60],['Bien cuit',65]],f:'Séchage + saisie brève.'},porc:{n:'Porc (filet, côte)',x:[['Rosé',60],['Juteux',63],['Bien cuit',68]],f:'Séchage + coloration rapide.'},agneau:{n:'Agneau (filet, selle)',x:[['Rosé',55],['À point',60],['Bien cuit',65]],f:'Séchage + saisie vive.'},canard:{n:'Canard (magret)',x:[['Rosé',56],['À point',60],['Bien cuit',65]],f:'Côté peau en premier, puis finition brève.'},poulet:{n:'Poulet (suprême)',x:[['Très juteux',63],['Juteux structuré',65],['Ferme classique',69]],f:'Séchage + saisie courte.'},dinde:{n:'Dinde (suprême)',x:[['Juteux',63],['Juteux structuré',66],['Ferme classique',70]],f:'Séchage + saisie courte.'},poisson:{n:'Poisson blanc (cabillaud, bar, Saint-Pierre)',x:[['Très nacré',48],['Nacré avec tenue',50],['Ferme',52]],f:'Service immédiat + finition très courte.'},saumon:{n:'Saumon',x:[['Très confit',46],['Confit-nacré',48],['Feuillets marqués',52]],f:'Service immédiat + salamandre courte.'},thon:{n:'Thon',x:[['Très rouge',45],['Rosé',48],['Cuit à cœur',52]],f:'Saisie très brève; servir immédiatement.'},truite:{n:'Truite',x:[['Nacrée',48],['Nacrée avec tenue',52],['Ferme',56]],f:'Service immédiat + finition courte.'},coquilles:{n:'Noix de Saint-Jacques',x:[['Nacrée',48],['Tendre',52],['Ferme',56]],f:'Bien sécher puis colorer brièvement.'},gambas:{n:'Crevettes / gambas',x:[['Très tendre',54],['Juteuse structurée',56],['Ferme',58]],f:'Service immédiat + flash plancha.'},homard:{n:'Homard / langouste',x:[['Nacré',52],['Tendre',55],['Ferme',58]],f:'Décortiquer selon la préparation; finition courte.'},racines:{n:'Légumes racines (carotte, panais, navet)',x:[['Ferme',84],['Fondant structuré',86],['Très fondant',88]],f:'Glacer avec le jus réduit.'},betterave:{n:'Betterave',x:[['Tenue ferme',88],['Fondante',90],['Très fondante',92]],f:'Ensacher séparément puis glacer.'},pommeDeTerre:{n:'Pomme de terre',x:[['Tenue ferme',85],['Fondante',90],['Très fondante',95]],f:'Choisir une variété adaptée et vérifier la texture.'},asperges:{n:'Asperges',x:[['Croquante',82],['Tendre',85],['Fondante',88]],f:'Calibrer les tiges et rafraîchir si le service est différé.'},courgettes:{n:'Courgette / aubergine',x:[['Tenue ferme',82],['Fondante',85],['Très fondante',88]],f:'Découper régulièrement; finir à la plancha si souhaité.'},choux:{n:'Chou-fleur / brocoli',x:[['Ferme',85],['Tendre',88],['Fondant',92]],f:'Séparer en bouquets de taille homogène.'},champignons:{n:'Champignons',x:[['Fermes',82],['Tendres',85],['Fondants',88]],f:'Ensacher en couche régulière; récupérer le jus.'},legumineuses:{n:'Légumineuses (déjà cuites)',x:[['Tenue',85],['Tendres',90],['Très fondantes',95]],f:'Utiliser des légumineuses déjà cuites; le calcul ne remplace pas leur cuisson préalable.'},ananas:{n:'Ananas',x:[['Ferme',70],['Confit structuré',76],['Très confit',82]],f:'Comparer témoin, imprégnation et cuisson.'},fruits:{n:'Fruits à chair (pomme, poire, pêche)',x:[['Tenue ferme',68],['Fondant structuré',76],['Très fondant',82]],f:'Adapter le temps à la maturité et à la découpe.'}};const p=document.querySelector('#p'),t=document.querySelector('#t'),o=document.querySelector('#o');Object.entries(D).forEach(([k,v])=>p.add(new Option(v.n,k)));function tex(){t.innerHTML='';D[p.value].x.forEach((v,i)=>t.add(new Option(v[0]+' — '+v[1]+' °C',i)))}function fmt(m){m=Math.ceil(m/5)*5;return m>=60?Math.floor(m/60)+' h '+(m%60?m%60+' min':''):m+' min'}function calc(){let d=Math.max(5,Math.min(120,+document.querySelector('#e').value||30)),sf=+document.querySelector('#s').value,v=D[p.value],c=v.x[+t.value],temp=c[1],min=75*Math.pow(d/25,2)*sf;if(['racines','betterave','pommeDeTerre','asperges','courgettes','choux','champignons','legumineuses','ananas','fruits'].includes(p.value))min*=.82;o.innerHTML='<div class="result"><div class="metric">Bain cible<b>'+temp+' °C</b></div><div class="metric">Montée estimée<b>'+fmt(min)+'</b></div><div class="metric">Épaisseur<b>'+d+' mm</b></div></div><div class="note"><b>'+v.n+' — '+c[0]+'</b><br>'+v.f+'<br><br><b>Validation :</b> même épaisseur et température initiale, sac témoin, mousse de pénétration et mini-sonde au centre thermique.</div><div class="warn"><b>Limite :</b> estimation pédagogique de montée à cœur. Elle ne valide ni pasteurisation, ni DLC, ni cuisson longue d’attendrissement. Toute production différée relève du PMS et d’une étude de vieillissement.</div>'}p.onchange=()=>{tex();calc()};document.querySelector('#go').onclick=calc;tex();calc();</script></html>
